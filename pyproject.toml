[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autoping"
version = "1.0.1"
description = "mass ping and TCP port checker"
requires-python = ">=3.8"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
ignore = ["S110", "BLE001", "PLW0602", "PLW1510"]