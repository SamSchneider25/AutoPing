name: AutoPing CI/CD

on: [push, pull_request] # Для тестов и линтера
# Чтобы publish срабатывал только на теги, оставить on: [push] здесь, 

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13' # Локальная версия Python
      
      - name: Install dependencies
        run: pip install ruff pytest build twine
      
      - name: Run linter
        run: ruff check .
      
      - name: Run tests
        run: pytest -v
      
      - name: Build package
        run: python -m build

  publish:
    needs: test-and-lint
    if: startsWith(github.ref, 'refs/tags/') # Сработает ТОЛЬКО при пуше тега
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install build tools
        run: pip install build twine
      
      - name: Build package
        run: python -m build
      
      - name: Publish to GitHub Packages
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.GITHUB_TOKEN_PACKAGES }}
        run: |
          twine upload dist/* \
            --repository-url https://upload.pkg.github.com/SamSchneider25/AutoPing