  publish:
    needs: test-and-lint
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # Нужно для создания Release
      packages: write      # Нужно для загрузки в Packages
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install build tools
        run: pip install build twine
      
      - name: Build package
        run: python -m build
      
      # 1. Создаём GitHub Release и цепляем к нему файлы из папки dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true # GitHub сам соберёт changelog из коммитов
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # 2. Публикуем в GitHub Packages (для pip install)
      - name: Publish to GitHub Packages
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          twine upload dist/* \
            --repository-url https://upload.pkg.github.com/SamSchneider25/AutoPing